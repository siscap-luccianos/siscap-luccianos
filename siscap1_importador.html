let running = false, cntOk = 0, cntErr = 0;

function log(msg, cls='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startImport() {
  if (running) return;
  running = true; cntOk = 0; cntErr = 0;
  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('log').innerHTML = '';
  log(`Iniciando importación de ${RECORDS.length} registros...`);

  for (let i = 0; i < RECORDS.length; i++) {
    if (!running) { log('⏹ Detenido.', 'warn'); break; }

    const r = RECORDS[i];
    document.getElementById('prog').style.width = Math.round((i+1)/RECORDS.length*100) + '%';

    const payload = {
      action: 'submit',
      fecha: r.fecha, evaluado: r.evaluado, local: r.local,
      evaluador: r.evaluador, tipo: r.tipo, rol: r.rol,
      antiguedad: r.antiguedad || '',
      porcentaje: r.porcentaje + '%',
      resultado: r.resultado,
      fortalezas: '', reforzar: '', observaciones: '',
      source: 'siscap1_import',
      s1: r.modulos[0]?.porcentaje ?? '—', s2: r.modulos[1]?.porcentaje ?? '—',
      s3: r.modulos[2]?.porcentaje ?? '—', s4: r.modulos[3]?.porcentaje ?? '—',
      s5: r.modulos[4]?.porcentaje ?? '—', s6: r.modulos[5]?.porcentaje ?? '—',
      s7: r.modulos[6]?.porcentaje ?? '—',
      detalleCompleto: {
        modulos: r.modulos.map(m => ({
          nombre: m.nombre, num: m.num, porcentaje: m.porcentaje,
          score: null, max: null, items_detalle: []
        }))
      }
    };

    try {
      const res = await fetch(SHEET_URL, {
        method: 'POST', headers: {'Content-Type':'text/plain'},
        body: JSON.stringify(payload)
      });
      const d = await res.json();
      if (d.status === 'ok' || d.status === 'duplicate') {
        cntOk++;
        const dup = d.status === 'duplicate' ? ' (duplicado, salteado)' : '';
        log(`✓ [${i+1}/${RECORDS.length}] ${r.evaluado} · ${r.local} · ${r.porcentaje}%${dup}`, 'ok');
      } else {
        cntErr++;
        log(`✗ [${i+1}] ${r.evaluado} — ${d.msg || 'Error'}`, 'err');
      }
    } catch(e) {
      cntErr++;
      log(`✗ [${i+1}] ${r.evaluado} — Red: ${e.message}`, 'err');
    }

    document.getElementById('cnt-ok').textContent = cntOk;
    document.getElementById('cnt-err').textContent = cntErr;
    await sleep(350);
  }

  running = false;
  document.getElementById('btn-start').disabled = false;
  document.getElementById('btn-stop').disabled = true;
  log(`\n─── Finalizado: ${cntOk} ok · ${cntErr} errores ───`, cntErr > 0 ? 'warn' : 'ok');
}

function stopImport() { running = false; document.getElementById('btn-stop').disabled = true; }
